<!doctype html>
<html lang="pt-BR">
<head>

<title>PFO — organização financeira</title>
<style>

main{padding-top:16px;padding-bottom:16px}
.mbar{display:flex;align-items:center;gap:8px;margin-bottom:20px}.mbar strong{flex:1;font-size:1.05rem}
.btn{font:inherit;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}.btn.sm{min-height:40px;padding:0 12px;font-size:.92rem}.btn.dan{color:var(--bad)}
.hero{padding:8px 0 28px}.hero p{font-size:1.1rem;color:var(--mut)}
.big{font-size:clamp(2.6rem,11vw,4.6rem);font-weight:600;letter-spacing:-.05em;line-height:1.02;font-variant-numeric:tabular-nums;margin:4px 0 6px}
.big.neg{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);margin-bottom:32px}
.stats div{padding:14px 12px 14px 0}.stats span{display:block;color:var(--mut);font-size:.9rem}.stats strong{font-size:1.3rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.two{display:grid;gap:32px;grid-template-columns:1fr}@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}

label{display:block;font-size:.9rem;color:var(--mut)}

input[type=checkbox]{display:inline-block;width:20px;min-height:20px;margin:0 8px 0 0;vertical-align:-4px}input[type=color]{padding:2px}
[aria-invalid=true]{border-color:var(--bad)}.err{display:block;color:var(--bad);font-size:.85rem;min-height:0}
.fa{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0}.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--ln);align-items:center}
.list .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.list .s{grid-column:1;color:var(--mut);font-size:.9rem}.list .a{grid-column:2;grid-row:1/3;display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tag{font-size:.85rem;font-weight:600}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.ok{color:var(--ok)}
.goals{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.goal{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;border-top:4px solid var(--gc)}
.gh{display:flex;gap:12px;align-items:center;margin-bottom:12px}.ill{width:64px;height:64px;flex:none}
.bar{height:12px;border-radius:99px;background:var(--ln);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--gc);transform-origin:left;transform:scaleX(0);transition:transform .7s cubic-bezier(.2,.8,.2,1);will-change:transform}
.mov{display:flex;gap:8px;margin:12px 0 8px}.mov input{margin:0;flex:1;min-width:0}
details{font-size:.9rem;color:var(--mut)}summary{cursor:pointer;min-height:32px}
.empty{text-align:center;padding:28px 12px;color:var(--mut)}.empty svg{display:block;margin:0 auto 8px}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.donut svg{width:160px;height:160px;flex:none}
.leg{list-style:none;margin:0;padding:0;flex:1;min-width:180px}.leg li{display:flex;gap:8px;align-items:center;padding:3px 0}.leg i{width:12px;height:12px;border-radius:3px;flex:none}.leg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist{margin-bottom:14px}.dist .bar{margin:6px 0 4px}.dist i{background:var(--ac)}
.ins{margin:0;padding-left:20px}.ins li{margin-bottom:8px}
.split{display:flex;gap:8px;margin-bottom:14px}.split label{flex:1}
footer{border-top:1px solid var(--ln);padding:20px 0 8px;font-size:.9rem;color:var(--mut)}footer .fa{margin:10px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;border-radius:10px;display:none;align-items:center;gap:12px;z-index:9;max-width:92vw}
#toast.on{display:flex}#toast button{font:inherit;min-height:40px;border:0;border-radius:8px;padding:0 12px;background:var(--bg);color:var(--ink);cursor:pointer}
@media(min-width:760px){#toast{bottom:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<a class="skip" href="#main">Pular para o conteúdo</a>
<header><div class="w"><div class="brandset"><span class="brand">PFO</span><div class="toptools" role="group" aria-label="Tema e privacidade"><button class="btn sm" type="button" data-theme-choice="light" aria-label="Ativar tema claro">Claro</button><button class="btn sm" type="button" data-theme-choice="dark" aria-label="Ativar tema escuro">Escuro</button><button class="btn sm" type="button" data-theme-choice="auto" aria-label="Usar tema do dispositivo">Auto</button><button class="btn sm" type="button" id="privacy-toggle" aria-pressed="false">Ocultar valores</button></div></div><span class="mut" id="warn" role="status"></span></div></header>
<nav aria-label="Seções"><a href="#painel">Painel</a><a href="#renda">Renda</a><a href="#fixas">Fixas</a><a href="#variaveis">Variáveis</a><a href="#caixinhas">Caixinhas</a></nav>
<div class="w"><main id="main" tabindex="-1"></main>
<footer>
<p>Seus dados ficam só neste navegador. Faça backup exportando o JSON.</p>
<div class="fa"><button class="btn sm" id="exp">Exportar dados (JSON)</button><label class="btn sm" style="display:inline-flex;align-items:center;margin:0;color:var(--ink)">Importar dados<input type="file" id="imp" accept=".json,application/json" class="sr"></label><button class="btn sm" id="demo">Carregar dados de exemplo</button><button class="btn sm dan" id="wipe">Apagar tudo</button></div>
<p>Ferramenta educativa de organização; não substitui orientação financeira profissional.</p>
</footer></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const KEY="prumo.v1",CATS=["Moradia","Alimentação","Transporte","Saúde","Lazer","Educação","Assinaturas","Outros"],CC=["#1f5d4a","#3b6ea5","#a0620f","#8a4f7d","#b4402f","#5c6b2f","#4a6f7d","#7a6a4f"];
const TY={emerg:["Reserva de emergência","#1f5d4a"],trip:["Viagem","#3b6ea5"],home:["Casa própria","#a0620f"],car:["Carro","#4a6f7d"],study:["Estudos","#8a4f7d"],retire:["Aposentadoria","#5c6b2f"],gift:["Presente ou evento","#b4402f"],custom:["Personalizada","#7a6a4f"]};
const IC={emerg:'<path d="M32 7l20 8v15c0 13-8 23-20 27C20 53 12 43 12 30V15z"/><path d="M23 31l7 7 12-14" fill="none"/>',
trip:'<rect x="11" y="22" width="42" height="28" rx="5"/><path d="M24 22v-5a3 3 0 013-3h10a3 3 0 013 3v5M11 34h42" fill="none"/>',
home:'<path d="M9 31L32 10l23 21M15 28v24h34V28z"/><path d="M27 52V38h10v14" fill="none"/>',
car:'<path d="M7 42v-9l7-12h28l9 12v9z"/><circle cx="20" cy="43" r="5" fill-opacity="1"/><circle cx="44" cy="43" r="5" fill-opacity="1"/><path d="M14 33h36" fill="none"/>',
study:'<path d="M7 14h18c5 0 7 2 7 7v31c0-4-2-6-7-6H7zM57 14H39c-5 0-7 2-7 7v31c0-4 2-6 7-6h18z"/>',
retire:'<circle cx="32" cy="32" r="10"/><path d="M32 10v7M32 47v7M10 32h7M47 32h7M16 16l5 5M43 43l5 5M48 16l-5 5M21 43l-5 5" fill="none"/>',
gift:'<rect x="11" y="27" width="42" height="25"/><rect x="9" y="19" width="46" height="8"/><path d="M32 19v33M32 19c-4-9-14-9-14-3s9 3 14 3zm0 0c4-9 14-9 14-3s-9 3-14 3z" fill="none"/>',
custom:'<circle cx="32" cy="32" r="21"/><circle cx="32" cy="32" r="12" fill="none"/><circle cx="32" cy="32" r="3" fill-opacity="1"/>'};
const ill=(t,c)=>`<svg class="ill" viewBox="0 0 64 64" aria-hidden="true" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${IC[t]||IC.custom}</svg>`;
const empty=t=>`<div class="empty"><svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><ellipse cx="32" cy="46" rx="18" ry="6"/><ellipse cx="32" cy="32" rx="18" ry="6"/><ellipse cx="32" cy="18" rx="18" ry="6"/><path d="M14 18v28M50 18v28" fill="none"/></svg><p>${t}</p></div>`;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=c=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(c/100);
const pad=n=>String(n).padStart(2,"0"),ym=d=>d.getFullYear()+"-"+pad(d.getMonth()+1),T=new Date(),TD=ym(T)+"-"+pad(T.getDate());
const sh=(m,n)=>{const[y,o]=m.split("-").map(Number);return ym(new Date(y,o-1+n,1))};
const ml=m=>{const[y,o]=m.split("-").map(Number),s=new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric"}).format(new Date(y,o-1,1));return s[0].toUpperCase()+s.slice(1)};
const dfmt=s=>new Intl.DateTimeFormat("pt-BR").format(new Date(s+"T12:00:00"));
const uid=()=>Math.random().toString(36).slice(2,9);
function pm(s){s=String(s||"").replace(/R\$|\s/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");const x=Number(s);return isFinite(x)&&x>=0?Math.round(x*100):NaN}
const val=c=>(c/100).toString().replace(".",",");
let ok=true;const def=()=>({ver:1,sal:0,salaryBase:null,salaryHistory:[],extras:[],fixed:[],vars:[],goals:[],split:[50,30,20],benefit:{mode:"clt",monthly:0,months:12}});
const valid=d=>d&&d.ver===1&&Number.isInteger(d.sal)&&["extras","fixed","vars","goals"].every(k=>Array.isArray(d[k]))&&Array.isArray(d.split)&&d.goals.every(g=>g&&Array.isArray(g.hist));
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(valid(d))return d}}catch(e){ok=false}return def()}
let S={...def(),...load()},ui={m:ym(T),v:"painel",edit:null,q:"",fc:"",focus:null};
const salaryAt=m=>{const h=(S.salaryHistory||[]).filter(x=>x&&x.m<=m&&Number.isInteger(x.amt)).sort((a,b)=>a.m.localeCompare(b.m));return h.length?h[h.length-1].amt:(Number.isInteger(S.salaryBase)?S.salaryBase:S.sal)};
const extraAmount=(e,m)=>{if(!e.rec)return e.m===m?e.amt:0;const freq=e.freq||"month",every=Math.max(1,Number(e.every)||1),start=e.start||((e.m||ym(T))+"-01"),[sy,sm,sd]=start.split("-").map(Number),[yy,mm]=m.split("-").map(Number),startMonth=sy*12+sm-1,targetMonth=yy*12+mm-1,monthDiff=targetMonth-startMonth;if(monthDiff<0)return 0;if(freq==="month")return monthDiff%every===0&&sd<=new Date(yy,mm,0).getDate()?e.amt:0;if(freq==="year")return monthDiff%(12*every)===0&&sd<=new Date(yy,mm,0).getDate()?e.amt:0;const step=(freq==="week"?7:1)*every,days=new Date(yy,mm,0).getDate();let count=0;for(let d=1;d<=days;d++){const delta=Math.round((Date.UTC(yy,mm-1,d)-Date.UTC(sy,sm-1,sd))/86400000);if(delta>=0&&delta%step===0)count++}return count*e.amt};
const recurrenceLabel=e=>{if(!e.rec)return"Pontual · "+ml(e.m);const f=e.freq||"month",n=Math.max(1,Number(e.every)||1),names={day:["dia","dias"],week:["semana","semanas"],month:["mês","meses"],year:["ano","anos"]};return"Cada "+(n===1?names[f][0]:n+" "+names[f][1])};
const benefitValues=()=>{const b=S.benefit||{mode:"clt",monthly:0,months:12},m=Math.max(0,Math.min(12,Number(b.months)||0)),base=Number(b.monthly)||salaryAt(ui.m),thirteenth=Math.round(base*m/12),vacBase=Math.round(base*m/12),third=Math.round(vacBase/3);return{thirteenth,vacation:vacBase+third,monthlyReserve:Math.round((base+base*4/3)/12)}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false}$("#warn").textContent=ok?"":"Sem armazenamento neste navegador: exporte seus dados."}
const commit=()=>{save();render()};
let tt;function toast(m,undo){const t=$("#toast");t.innerHTML=`<span>${esc(m)}</span>`+(undo?'<button>Desfazer</button>':"");t.classList.add("on");if(undo)$("button",t).onclick=()=>{undo();t.classList.remove("on")};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),6000)}
function del(k,id,msg){const snap=JSON.stringify(S);S[k]=S[k].filter(x=>x.id!==id);ui.edit=null;commit();toast(msg,()=>{S=JSON.parse(snap);commit()})}
function calc(m){const inc=salaryAt(m)+S.extras.reduce((a,e)=>a+extraAmount(e,m),0),fx=S.fixed.reduce((a,f)=>a+f.amt,0),vr=S.vars.filter(v=>v.date.startsWith(m)),vt=vr.reduce((a,v)=>a+v.amt,0),
sv=Math.max(0,S.goals.flatMap(g=>g.hist).filter(h=>!h.init&&h.d.startsWith(m)).reduce((a,h)=>a+h.amt,0)),cat={};
S.fixed.forEach(f=>cat[f.cat]=(cat[f.cat]||0)+f.amt);vr.forEach(v=>cat[v.cat]=(cat[v.cat]||0)+v.amt);return{inc,fx,vt,sv,bal:inc-fx-vt-sv,cat,vr}}
const fld=(n,l,v="",a="")=>`<label>${l}<input name="${n}" value="${esc(v)}" ${a}><span class="err" role="alert"></span></label>`;
const sel=(n,l,o,v)=>`<label>${l}<select name="${n}">${o.map(x=>{const[k,t]=Array.isArray(x)?x:[x,x];return`<option value="${esc(k)}"${k===v?" selected":""}>${esc(t)}</option>`}).join("")}</select></label>`;
const money=(n,l,v)=>fld(n,l,v===undefined?"":val(v),'inputmode="decimal" autocomplete="off" placeholder="0,00"');
const acts=(k,id)=>`<button class="btn sm" data-act="edit" data-k="${k}" data-id="${id}">Editar</button><button class="btn sm dan" data-act="del" data-k="${k}" data-id="${id}">Excluir</button>`;
const fbtn=k=>`<div class="fa"><button class="btn pri">${ui.edit&&ui.edit.k===k?"Salvar alterações":"Adicionar"}</button>${ui.edit&&ui.edit.k===k?'<button type="button" class="btn" data-act="cancel">Cancelar</button>':""}</div>`;
const ed=k=>ui.edit&&ui.edit.k===k?S[k].find(x=>x.id===ui.edit.id):null;
const mbar=()=>`<div class="mbar"><button class="btn" data-act="mo" data-n="-1" aria-label="Mês anterior">‹</button><strong>${ml(ui.m)}</strong><button class="btn" data-act="mo" data-n="1" aria-label="Próximo mês">›</button><button class="btn" data-act="mo" data-n="0">Hoje</button></div>`;
const dueTag=(f,m)=>{if(f.paid&&f.paid[m])return'<span class="tag ok">Pago</span>';if(m<ym(T))return'<span class="tag bad">Em aberto</span>';if(m>ym(T))return"";const d=f.day-T.getDate();return d<0?'<span class="tag bad">Atrasada</span>':d===0?'<span class="tag warn">Vence hoje</span>':d<=3?`<span class="tag warn">Vence em ${d} dia${d>1?"s":""}</span>`:""};
const V={};
V.painel=()=>{const c=calc(ui.m),sp=S.split,gasto=c.fx+c.vt,pc=c.inc?Math.round(gasto/c.inc*100):0;
const tot=Object.values(c.cat).reduce((a,b)=>a+b,0),ents=Object.entries(c.cat).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);let cum=0;
const dn=ents.map(([k,v],i)=>{const p=v/tot*100,s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${CC[CATS.indexOf(k)%8]||CC[7]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-cum}"/>`;cum+=p;return s}).join("");
const dist=[["Fixas (necessidades)",c.fx,sp[0]],["Variáveis (desejos)",c.vt,sp[1]],["Guardado (futuro)",c.sv,sp[2]]].map(([l,v,t],i)=>{const r=c.inc?v/c.inc*100:0;return`<div class="dist"><div style="display:flex;justify-content:space-between;gap:8px"><span>${l}</span><strong class="n">${fmt(v)}</strong></div><div class="bar" aria-hidden="true"><i style="transform:scaleX(${Math.min(1,r/100)})"></i></div><span class="mut">${Math.round(r)}% da renda, sugerido ${t}%${i<2?(r>t?" (acima)":" (dentro)"):(r<t?" (abaixo)":" (atingido)")}</span></div>`}).join("");
