<html lang="pt-BR">
<head>

<title>Meu dinheiro — organização financeira</title>
<style>
:root{color-scheme:light dark;--bg:#f4f2ec;--panel:#fffefa;--ink:#252b27;--muted:#717871;--line:#e5e3dc;--accent:#356a55;--accent-weak:#e3eee7;--good:#357553;--warn:#94651b;--bad:#a84b45;--shadow:0 6px 24px #292d2410;--radius:18px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-synthesis:none}
@media(prefers-color-scheme:dark){:root{--bg:#171b18;--panel:#202622;--ink:#edf1ec;--muted:#a7b0a8;--line:#39413b;--accent:#88bd9d;--accent-weak:#293a30;--good:#8fc39c;--warn:#e0b46a;--bad:#e4867d;--shadow:0 6px 24px #0003}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:active{transform:scale(.98)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:inherit}.skip{position:absolute;left:-999px;top:8px;background:var(--panel);padding:10px}.skip:focus{left:8px;z-index:10}.wrap{max-width:1200px;margin:auto;padding:24px 28px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:8px 0 22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:13px;background:var(--accent);display:grid;place-items:center;color:var(--panel)}h1{font-size:22px;letter-spacing:-.04em;margin:0;font-weight:650}.privacy{font-size:12px;color:var(--muted);max-width:300px;text-align:right}.layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:28px;margin-top:24px}.side{display:flex;flex-direction:column;gap:6px}.navbtn{border:0;background:none;color:var(--muted);text-align:left;padding:12px 14px;border-radius:12px;min-height:48px;font-weight:550}.navbtn[aria-current="page"]{background:var(--accent-weak);color:var(--accent)}main{min-width:0}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}.pagehead h2{margin:0;font-size:21px;letter-spacing:-.035em}.month{display:flex;align-items:center;gap:6px}.month strong{min-width:130px;text-align:center;font-size:14px}.iconbtn,.secondary,.primary,.danger{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;min-height:44px;padding:9px 13px}.iconbtn{width:44px;padding:0}.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.secondary{font-weight:550}.danger{color:var(--bad)}.hero{background:var(--accent);color:#fff;border-radius:var(--radius);padding:24px 26px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.hero small{opacity:.8;display:block}.hero strong{font-size:clamp(34px,5vw,54px);letter-spacing:-.055em;line-height:1.15;font-variant-numeric:tabular-nums}.hero .sub{font-size:13px;opacity:.86}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);min-width:0}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;margin-top:7px;font-size:20px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section{margin-top:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section h3{margin:0;font-size:16px;letter-spacing:-.02em}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line);min-width:0}.row:first-of-type{border-top:0}.row .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .amount{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.actions{display:flex;gap:6px;align-items:center;flex-shrink:0}.smallbtn{background:transparent;border:1px solid var(--line);border-radius:9px;min-height:38px;padding:6px 10px;color:var(--ink)}.pill{border-radius:99px;padding:3px 8px;font-size:12px;background:var(--accent-weak);color:var(--accent)}.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}form.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted)}input,select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;min-height:46px;padding:10px 12px;width:100%;font-size:16px}input[type=color]{padding:5px;height:46px}.formfoot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:4px}.empty{text-align:center;padding:22px;color:var(--muted)}.empty svg{display:block;margin:0 auto 8px;width:60px;height:48px}.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:var(--p,0%);background:var(--accent);border-radius:inherit;transform-origin:left;transition:transform .45s ease}.goalgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.goal .goalhead{display:flex;gap:12px;align-items:center}.goal svg{width:44px;height:44px;flex-shrink:0}.goal .goalhead strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.goal .stats{display:flex;justify-content:space-between;gap:8px;font-size:13px}.chartrow{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:20px}.donut{width:145px;height:145px}.legend{display:grid;gap:8px}.legend div{display:flex;justify-content:space-between;gap:8px;font-size:13px}.barline{display:grid;grid-template-columns:105px 1fr 90px;gap:10px;align-items:center;margin:10px 0;font-size:13px}.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;background:var(--accent);width:var(--w);border-radius:inherit;transition:width .4s}.budget{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.budget input{width:72px;min-height:38px;text-align:right}.toast{position:fixed;z-index:5;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}.toast button{border:0;background:transparent;color:inherit;text-decoration:underline}.bottomnav{display:none}.storage{color:var(--warn);font-size:12px;margin:8px 0}.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}
@media(max-width:800px){.wrap{padding:18px 18px 100px}.layout{display:block}.side{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.bottomnav{position:fixed;z-index:4;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;bottom:0;left:0;right:0;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}.bottomnav .navbtn{text-align:center;font-size:11px;padding:8px 2px;min-height:48px}.bottomnav .navbtn[aria-current=page]{background:var(--accent-weak)}}@media(max-width:520px){.wrap{padding:12px 14px 100px}.top{align-items:flex-start}.privacy{max-width:180px;font-size:11px}.hero{padding:20px;align-items:flex-start;flex-direction:column}.grid,.goalgrid{grid-template-columns:1fr}.chartrow{grid-template-columns:120px 1fr;gap:12px}.donut{width:118px;height:118px}.barline{grid-template-columns:82px 1fr 75px;gap:7px;font-size:12px}.pagehead{align-items:flex-start;flex-direction:column}.month{align-self:flex-end}form.fields{grid-template-columns:1fr}.field.full,.formfoot{grid-column:auto}.budget{grid-template-columns:1fr auto}.budget .real{grid-column:1/-1}.row{gap:8px}.actions .smallbtn{padding:5px 8px}.cards .card{padding:14px}.metric strong{font-size:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<div class="wrap">
<header class="top"><div class="brand"><div class="mark" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M4 17.5 9 12l3.2 3.2L20 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><h1>Meu dinheiro</h1></div><div class="privacy">Seus dados ficam só neste navegador. Faça backup exportando o JSON.</div></header>
<div id="storage-note" class="storage hidden" role="status">O armazenamento deste navegador está indisponível. Seus dados ficarão apenas nesta sessão.</div>
<div class="layout"><nav class="side" aria-label="Navegação principal" id="navside"></nav><main id="conteudo" tabindex="-1"><div id="app"></div></main></div>
<footer class="footer">Ferramenta educativa de organização; não substitui orientação financeira profissional.</footer>
</div><nav id="navbottom" class="bottomnav" aria-label="Navegação principal"></nav><div id="toast" class="hidden" role="status" aria-live="polite"></div>
<script>
"use strict";
const KEY="meu-dinheiro-v1";
const TYPES=["Reserva de emergência","Viagem","Casa própria","Carro","Estudos","Aposentadoria","Presente/Evento","Personalizada"];
const DEFAULT_CATS=[{name:"Moradia",color:"#788e7c",kind:"necessidade"},{name:"Alimentação",color:"#b88a51",kind:"necessidade"},{name:"Transporte",color:"#758ca3",kind:"necessidade"},{name:"Saúde",color:"#a66c63",kind:"necessidade"},{name:"Lazer",color:"#9277a5",kind:"desejo"},{name:"Compras",color:"#ba8062",kind:"desejo"},{name:"Educação",color:"#6d9d92",kind:"futuro"},{name:"Outros",color:"#89908a",kind:"necessidade"}];
const monthNow=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const empty=()=>({schemaVersion:1,salaryCents:0,extras:[],fixed:[],variable:[],goals:[],categories:structuredClone(DEFAULT_CATS),budgets:{necessidade:50,desejo:30,futuro:20}});
let state=empty(), currentMonth=monthNow(), view="Painel", storageOK=true,toastTimer;
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cents=v=>Math.round(Number(v)||0), money=n=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format((n||0)/100);
const dateFmt=s=>s?new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeZone:"UTC"}).format(new Date(s+"T12:00:00Z")):"";
const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
function read(){try{let raw=localStorage.getItem(KEY);if(raw){let x=JSON.parse(raw);if(x&&x.schemaVersion===1&&Array.isArray(x.fixed)&&Array.isArray(x.variable)&&Array.isArray(x.goals)){state={...empty(),...x};return}}}catch(e){storageOK=false}state=empty()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}$("#storage-note").classList.toggle("hidden",storageOK)}
function parseMoney(v){let s=String(v).trim().replace(/\s/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");let n=Number(s);return Number.isFinite(n)&&n>=0?Math.round(n*100):null}
function monthLabel(m){let [y,mo]=m.split("-").map(Number);return new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,mo-1,1)))}
const inMonth=(d,m)=>String(d||"").slice(0,7)===m;
function metrics(){let vars=state.variable.filter(x=>inMonth(x.date,currentMonth)),fixed=state.fixed.filter(x=>!x.month||x.month===currentMonth),income=state.salaryCents+state.extras.filter(x=>x.recurring||inMonth(x.date,currentMonth)).reduce((a,x)=>a+x.amount,0),fx=fixed.reduce((a,x)=>a+x.amount,0),vx=vars.reduce((a,x)=>a+x.amount,0),saved=state.goals.reduce((a,x)=>a+x.current,0);return{vars,fixed,income,fx,vx,saved,balance:income-fx-vx-saved}}
function nav(){let items=["Painel","Renda","Fixas","Variáveis","Caixinhas"];for(let target of ["#navside","#navbottom"]){$(target).innerHTML=items.map(x=>'<button class="navbtn" data-view="'+x+'" '+(view===x?'aria-current="page"':'')+'>'+x+'</button>').join("")}}
function emptySvg(){return '<svg viewBox="0 0 70 52" role="img" aria-label="Ilustração de caderno"><path d="M13 9h34a5 5 0 0 1 5 5v29H18a5 5 0 0 1-5-5V9Z" fill="var(--accent-weak)" stroke="var(--accent)" stroke-width="1.5"/><path d="M20 18h22M20 25h18M20 32h20M52 17h7v26H18" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/></svg>'}
function goalSvg(type,color){let ix=TYPES.indexOf(type);let shapes=['<path d="M22 44V25l14-12 14 12v19H22Z" fill="COLOR" opacity=".25" stroke="COLOR"/><path d="M29 44V31h14v13M18 25l18-15 18 15" fill="none" stroke="COLOR" stroke-width="2" stroke-linejoin="round"/>','<path d="M18 18h35L48 45H25l-7-27Z" fill="COLOR" opacity=".24" stroke="COLOR"/><path d="m18 18 18 12 17-12M36 30v15" fill="none" stroke="COLOR" stroke-width="2"/>','<path d="M16 27 36 11l20 16v19H16V27Z" fill="COLOR" opacity=".25" stroke="COLOR"/><path d="M29 46V31h14v15M12 27 36 8l24 19" fill="none" stroke="COLOR" stroke-width="2"/>','<path d="M13 34h46l-5-14H19l-6 14Z" fill="COLOR" opacity=".25" stroke="COLOR"/><path d="M18 34v10h36V34M23 44a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM49 44a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM23 20l5-8h17l5 8" fill="none" stroke="COLOR" stroke-width="2"/>','<path d="M20 12h32v35H20z" fill="COLOR" opacity=".2" stroke="COLOR"/><path d="M26 20h20M26 27h20M26 34h12M26 41h16" stroke="COLOR" stroke-width="2" stroke-linecap="round"/>','<path d="M36 9 54 17v13c0 11-8 16-18 20-10-4-18-9-18-20V17l18-8Z" fill="COLOR" opacity=".24" stroke="COLOR"/><path d="m27 29 6 6 13-14" fill="none" stroke="COLOR" stroke-width="2"/>','<path d="M18 23h36v26H18zM13 18h46v8H13zM36 18v31M36 18c-14-1-12-12-5-10 5 1 5 10 5 10Zm0 0c14-1 12-12 5-10-5 1-5 10-5 10Z" fill="COLOR" opacity=".22" stroke="COLOR" stroke-width="1.7"/>','<circle cx="36" cy="28" r="17" fill="COLOR" opacity=".2" stroke="COLOR"/><path d="M36 17v12l8 5M36 8v4M17 28h4M51 28h4" fill="none" stroke="COLOR" stroke-width="2" stroke-linecap="round"/>'];return '<svg viewBox="0 0 72 58" role="img" aria-label="Ilustração: '+esc(type)+'">'+shapes[Math.max(ix,0)].replaceAll("COLOR",esc(color||"#356a55"))+'</svg>'}
function stat(label,value){return '<div class="card metric"><span>'+label+'</span><strong>'+money(value)+'</strong></div>'}
function panel(){let m=metrics(), cats={};for(let x of [...m.vars,...m.fixed]){let c=x.category||"Outros";cats[c]=(cats[c]||0)+x.amount}let entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);let total=entries.reduce((a,x)=>a+x[1],0)||1;let colors=entries.map(x=>state.categories.find(c=>c.name===x[0])?.color||"#89908a");let acc=0, circles=entries.map((x,i)=>{let v=x[1]/total*100,start=acc;acc+=v;return '<circle cx="60" cy="60" r="42" fill="none" stroke="'+colors[i]+'" stroke-width="15" stroke-dasharray="'+(v*2.64)+' 264" stroke-dashoffset="'+(-start*2.64)+'" transform="rotate(-90 60 60)"/>'}).join("");let catsMarkup=entries.length?'<div class="chartrow"><svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Gráfico de despesas por categoria">'+circles+'</svg><div class="legend">'+entries.map((x,i)=>'<div><span><i style="color:'+colors[i]+'">●</i> '+esc(x[0])+'</span><b>'+money(x[1])+'</b></div>').join("")+'</div></div>':'<div class="empty">'+emptySvg()+'Suas despesas por categoria aparecerão aqui.</div>';let max=Math.max(m.fx,m.vx,m.saved,1);let over=Math.round(m.income?((m.fx+m.vx+m.saved)/m.income*100):0);let late=state.fixed.filter(x=>x.status!=="pago"&&x.due<new Date().getDate());let soon=state.fixed.filter(x=>x.status!=="pago"&&x.due>=new Date().getDate()&&x.due<=new Date().getDate()+3);let insights=[];if(late.length)insights.push(late.length+" conta(s) fixa(s) estão atrasadas.");if(soon.length)insights.push(soon.length+" conta(s) vencem nos próximos 3 dias.");if(m.balance<0)insights.push("O saldo previsto está negativo em "+money(-m.balance)+".");if(entries[0])insights.push("Sua maior categoria neste mês é "+entries[0][0]+".");if(state.goals.length)insights.push("Faltam "+money(state.goals.reduce((a,g)=>a+Math.max(0,g.target-g.current),0))+" para completar suas metas.");if(!insights.length)insights.push("Tudo tranquilo por aqui. Registre seus movimentos para receber um resumo.");
return '<div class="pagehead"><h2>Visão do mês</h2><div class="month"><button class="iconbtn" data-month="-1" aria-label="Mês anterior">‹</button><strong>'+esc(monthLabel(currentMonth))+'</strong><button class="iconbtn" data-month="1" aria-label="Próximo mês">›</button><button class="smallbtn" data-action="this-month">Hoje</button></div></div><section class="hero"><div><small>Saldo do mês</small><strong>'+money(m.balance)+'</strong><div class="sub">Renda menos despesas e valores guardados</div></div><div class="sub">'+over+'% da renda comprometida</div></section><div class="cards">'+stat("Renda",m.income)+stat("Despesas fixas",m.fx)+stat("Despesas variáveis",m.vx)+stat("Guardado",m.saved)+'</div><div class="grid"><section class="section"><div class="sectionhead"><h3>Gastos por categoria</h3></div>'+catsMarkup+'</section><section class="section"><div class="sectionhead"><h3>Para onde foi o dinheiro</h3></div>'+[['Fixas',m.fx],['Variáveis',m.vx],['Guardado',m.saved]].map(x=>'<div class="barline"><span>'+x[0]+'</span><div class="bar"><i style="--w:'+Math.round(x[1]/max*100)+'%"></i></div><b style="text-align:right">'+money(x[1])+'</b></div>').join("")+'</section></div><section class="section"><div class="sectionhead"><h3>Orçamento sugerido</h3><span class="muted">Edite os percentuais</span></div>'+["necessidade","desejo","futuro"].map((k,i)=>{let names=["Necessidades","Desejos","Futuro"],real=i===2?m.saved:i===0?m.fx+m.vars.filter(x=>state.categories.find(c=>c.name===x.category)?.kind==="necessidade").reduce((a,x)=>a+x.amount,0):m.vx;return '<div class="budget"><span>'+names[i]+'</span><label class="muted">'+(state.budgets[k]||0)+'% sugerido <input aria-label="Percentual sugerido: '+names[i]+'" data-budget="'+k+'" type="number" min="0" max="100" value="'+(state.budgets[k]||0)+'">%</label><b class="real">'+money(real)+' / '+money(Math.round(m.income*(state.budgets[k]||0)/100))+'</b></div>'}).join("")+'</section><section class="section"><div class="sectionhead"><h3>Um olhar para o mês</h3></div>'+insights.map(x=>'<div class="row"><span>'+esc(x)+'</span></div>').join("")+'</section>'}
function formField(label,name,type="text",value="",extra=""){return '<div class="field"><label for="f-'+name+'">'+label+'</label><input id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>'}
function categorySelect(selected=""){return '<div class="field"><label for="f-category">Categoria</label><select id="f-category" name="category">'+state.categories.map(c=>'<option '+(c.name===selected?'selected':'')+'>'+esc(c.name)+'</option>').join("")+'</select></div>'}
function rowItem(x,type){let name=x.name||x.description;let status=type==="fixed"?(x.status==="pago"?'<span class="pill">Pago</span>':x.due<new Date().getDate()?'<span class="pill bad">Atrasada</span>':'<span class="pill warn">Pendente</span>'):"";return '<div class="row"><span class="name">'+esc(name)+' <span class="muted">'+esc(x.category||"")+(type==="fixed"?" · vence dia "+x.due:" · "+dateFmt(x.date))+'</span></span><span class="amount">'+money(x.amount)+'</span>'+status+'<span class="actions">'+(type==="fixed"&&x.status!=="pago"?'<button class="smallbtn" data-action="paid" data-id="'+x.id+'">Pagar</button>':'')+'<button class="smallbtn" data-action="edit-'+type+'" data-id="'+x.id+'">Editar</button><button class="smallbtn" data-action="delete-'+type+'" data-id="'+x.id+'">Excluir</button></span></div>'}
function incomePage(){let extras=state.extras;return '<div class="pagehead"><h2>Renda</h2></div><section class="section"><div class="sectionhead"><h3>Salário líquido mensal</h3></div><form id="salary-form" class="fields">'+formField("Valor líquido","salary","text",(state.salaryCents/100).toFixed(2).replace(".",","),'inputmode="decimal" autocomplete="off"')+'<div class="formfoot"><button class="primary">Salvar salário</button></div></form></section><section class="section"><div class="sectionhead"><h3>Rendas extras</h3></div>'+(extras.length?extras.map(x=>'<div class="row"><span class="name">'+esc(x.name)+' <span class="muted">'+(x.recurring?"Recorrente":"Pontual")+'</span></span><b class="amount">'+money(x.amount)+'</b><span class="actions"><button class="smallbtn" data-action="edit-extra" data-id="'+x.id+'">Editar</button><button class="smallbtn" data-action="delete-extra" data-id="'+x.id+'">Excluir</button></span></div>').join(""):'<div class="empty">'+emptySvg()+'Nenhuma renda extra cadastrada.</div>')+'</section><section class="section"><div class="sectionhead"><h3>Adicionar renda extra</h3></div><form id="extra-form" class="fields">'+formField("Nome","name") + formField("Valor","amount","text","","inputmode=\\"decimal\\" autocomplete=\\"off\\"")+'<div class="field"><label for="f-recurring">Frequência</label><select id="f-recurring" name="recurring"><option value="false">Pontual</option><option value="true">Recorrente mensal</option></select></div>'+formField("Data (para pontual)","date","date",new Date().toISOString().slice(0,10))+'<div class="formfoot"><button class="primary">Adicionar renda</button></div></form></section>'}
function fixedPage(edit){return '<div class="pagehead"><h2>Despesas fixas</h2></div><section class="section"><div class="sectionhead"><h3>Contas do mês</h3><span class="muted">Toque em Pagar ao quitar uma conta</span></div>'+(state.fixed.length?state.fixed.map(x=>rowItem(x,"fixed")).join(""):'<div class="empty">'+emptySvg()+'Nenhuma conta fixa cadastrada.</div>')+'</section><section class="section"><div class="sectionhead"><h3>Adicionar conta fixa</h3></div><form id="fixed-form" class="fields">'+formField("Nome","name")+formField("Valor","amount","text","","inputmode=\\"decimal\\" autocomplete=\\"off\\"")+categorySelect()+'<div class="field"><label for="f-due">Dia de vencimento</label><input id="f-due" name="due" type="number" min="1" max="31" value="10"></div><div class="field"><label for="f-status">Status</label><select id="f-status" name="status"><option value="pendente">Pendente</option><option value="pago">Pago</option></select></div><div class="formfoot"><button class="primary">Adicionar conta</button></div></form></section>'}
function variablePage(){let list=metrics().vars;return '<div class="pagehead"><h2>Despesas variáveis</h2></div><section class="section"><div class="sectionhead"><h3>Lançamento rápido</h3><span class="muted">Enter adiciona</span></div><form id="var-form" class="fields">'+formField("Descrição","description")+formField("Valor","amount","text","","inputmode=\\"decimal\\" autocomplete=\\"off\\"")+categorySelect() + formField("Data","date","date",new Date().toISOString().slice(0,10))+'<div class="field"><label for="f-payment">Forma de pagamento (opcional)</label><input id="f-payment" name="payment" autocomplete="off"></div><div class="formfoot"><button class="primary">Adicionar despesa</button></div></form></section><section class="section"><div class="sectionhead"><h3>Lançamentos deste mês</h3></div><div class="field"><label for="search">Buscar lançamento</label><input id="search" type="search" placeholder="Descrição ou categoria"></div><div id="vars-list">'+(list.length?list.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>rowItem(x,"variable")).join(""):'<div class="empty">'+emptySvg()+'Seus lançamentos aparecerão aqui.</div>')+'</div></section>'}
function goalsPage(){return '<div class="pagehead"><h2>Caixinhas</h2></div><section class="section"><div class="sectionhead"><h3>Seus objetivos</h3></div>'+(state.goals.length?'<div class="goalgrid">'+state.goals.map(g=>{let p=Math.min(100,Math.round(g.current/Math.max(g.target,1)*100)),left=Math.max(0,g.target-g.current),months=g.deadline?Math.max(1,Math.ceil((new Date(g.deadline+"T12:00:00")-new Date())/(30*86400000))):0;return '<article class="card goal"><div class="goalhead">'+goalSvg(g.type,g.color)+'<div><strong>'+esc(g.name)+'</strong><span class="muted">'+esc(g.type)+(p>=100?' · Meta concluída':'')+'</span></div></div><div class="progress" role="progressbar" aria-label="Progresso de '+esc(g.name)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><i style="--p:'+p+'%"></i></div><div class="stats"><span>'+money(g.current)+' guardados</span><span>'+p+'%</span></div><div class="stats muted"><span>Faltam '+money(left)+'</span><span>'+(months?' '+money(Math.ceil(left/months))+'/mês':'')+'</span></div><div class="actions" style="margin-top:10px"><button class="smallbtn" data-action="deposit" data-id="'+g.id+'">Depositar</button><button class="smallbtn" data-action="withdraw" data-id="'+g.id+'">Retirar</button><button class="smallbtn" data-action="edit-goal" data-id="'+g.id+'">Editar</button><button class="smallbtn" data-action="delete-goal" data-id="'+g.id+'">Excluir</button></div></article>'}).join("")+'</div>':'<div class="empty">'+emptySvg()+'Uma meta de cada vez. Crie sua primeira caixinha abaixo.</div>')+'</section><section class="section"><div class="sectionhead"><h3>Criar caixinha</h3></div><form id="goal-form" class="fields">'+formField("Nome da meta","name")+'<div class="field"><label for="f-type">Tipo e ilustração</label><select id="f-type" name="type">'+TYPES.map(t=>'<option>'+t+'</option>').join("")+'</select></div>'+formField("Valor-alvo","target","text","","inputmode=\\"decimal\\" autocomplete=\\"off\\"")+formField("Valor inicial (opcional)","current","text","0","inputmode=\\"decimal\\" autocomplete=\\"off\\"")+formField("Prazo (opcional)","deadline","date")+'<div class="field"><label for="f-color">Cor</label><input id="f-color" name="color" type="color" value="#6f997c"></div><div class="formfoot"><button class="primary">Criar caixinha</button></div></form></section><section class="section"><div class="sectionhead"><h3>Categorias</h3></div>'+state.categories.map(c=>'<div class="row"><span><i style="color:'+esc(c.color)+'">●</i> '+esc(c.name)+' <span class="muted">'+esc(c.kind)+'</span></span><span class="actions"><button class="smallbtn" data-action="edit-category" data-id="'+esc(c.name)+'">Renomear/cor</button></span></div>').join("")+'<form id="category-form" class="fields" style="margin-top:12px">'+formField("Nova categoria","name")+'<div class="field"><label for="f-kind">Tipo do orçamento</label><select name="kind" id="f-kind"><option value="necessidade">Necessidade</option><option value="desejo">Desejo</option><option value="futuro">Futuro</option></select></div><div class="formfoot"><button class="secondary">Criar categoria</button></div></form></section><section class="section"><div class="sectionhead"><h3>Seus dados</h3></div><div class="actions"><button class="secondary" data-action="export">Exportar dados (JSON)</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">Importar dados<input id="import-file" type="file" accept="application/json,.json" hidden></label><button class="secondary" data-action="sample">Carregar dados de exemplo</button><button class="danger" data-action="wipe">Apagar tudo</button></div></section>'}
function render(){nav();let html=view==="Painel"?panel():view==="Renda"?incomePage():view==="Fixas"?fixedPage():view==="Variáveis"?variablePage():goalsPage();$("#app").innerHTML=html;$("#storage-note").classList.toggle("hidden",storageOK)}
function toast(msg,undo){let el=$("#toast");el.innerHTML=esc(msg)+(undo?' <button id="undo">Desfazer</button>':'');el.classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add("hidden"),6000);if(undo)$("#undo").onclick=()=>{undo();el.classList.add("hidden");save();render()}}
function remove(arr,idv){let i=arr.findIndex(x=>x.id===idv);if(i<0)return;let [x]=arr.splice(i,1);save();render();toast("Item excluído.",()=>arr.splice(i,0,x))}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="meu-dinheiro-backup.json";a.click();URL.revokeObjectURL(a.href)}
function validateImport(x){return x&&x.schemaVersion===1&&Number.isInteger(x.salaryCents)&&Array.isArray(x.extras)&&Array.isArray(x.fixed)&&Array.isArray(x.variable)&&Array.isArray(x.goals)&&Array.isArray(x.categories)&&x.extras.every(y=>Number.isInteger(y.amount))&&x.fixed.every(y=>Number.isInteger(y.amount)&&Number.isInteger(y.due))&&x.variable.every(y=>Number.isInteger(y.amount))&&x.goals.every(y=>Number.isInteger(y.target)&&Number.isInteger(y.current))}
function sample(){let t=monthNow();state={...empty(),salaryCents:520000,extras:[{id:id(),name:"Freela de design",amount:75000,recurring:false,date:t+"-08"}],fixed:[{id:id(),name:"Aluguel",amount:160000,category:"Moradia",due:5,status:"pago",month:t},{id:id(),name:"Internet",amount:11990,category:"Moradia",due:20,status:"pendente",month:t}],variable:[{id:id(),description:"Mercado da semana",amount:18450,category:"Alimentação",date:t+"-04",payment:"Débito"},{id:id(),description:"Cinema",amount:5600,category:"Lazer",date:t+"-11",payment:"Crédito"}],goals:[{id:id(),name:"Reserva de emergência",type:TYPES[0],target:300000,current:85000,deadline:"2027-06-30",color:"#6f997c",history:[]} ]};save();render();toast("Exemplo carregado.")}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.month){let d=new Date(currentMonth+"-01T12:00:00");d.setMonth(d.getMonth()+Number(b.dataset.month));currentMonth=monthNowFrom(d);render();return}let a=b.dataset.action,idv=b.dataset.id;
if(a==="this-month"){currentMonth=monthNow();render()}else if(a==="paid"){let x=state.fixed.find(x=>x.id===idv);x.status="pago";save();render();toast("Conta marcada como paga.")}else if(a==="export")exportData();else if(a==="sample")sample();else if(a==="wipe"){if(confirm("Apagar todos os dados deste navegador? Esta ação não pode ser desfeita.")){state=empty();save();render();toast("Dados apagados.")}}
else if(a?.startsWith("delete-")){let key=a==="delete-fixed"?"fixed":a==="delete-variable"?"variable":a==="delete-goal"?"goals":"extras";remove(state[key],idv)}
else if(a==="deposit"||a==="withdraw"){let g=state.goals.find(x=>x.id===idv),v=parseMoney(prompt(a==="deposit"?"Quanto deseja depositar?":"Quanto deseja retirar?","0,00"));if(v===null)return;if(a==="withdraw"&&v>g.current){toast("O valor ultrapassa o saldo da caixinha.");return}g.current+=a==="deposit"?v:-v;g.history=g.history||[];g.history.push({date:new Date().toISOString(),type:a,amount:v});save();render();toast(g.current>=g.target?"Meta concluída. Parabéns pelo progresso.":"Movimentação registrada.")}
else if(a?.startsWith("edit-")){editItem(a.slice(5),idv)}
else if(a==="edit-category"){let c=state.categories.find(x=>x.name===idv);if(!c)return;let n=prompt("Nome da categoria",c.name);if(!n)return;let color=prompt("Cor hexadecimal",c.color);state.variable.forEach(x=>{if(x.category===c.name)x.category=n});state.fixed.forEach(x=>{if(x.category===c.name)x.category=n});c.name=n;if(color&&/^#[0-9a-f]{6}$/i.test(color))c.color=color;save();render()}
});
function monthNowFrom(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function submitMoney(form,name){let value=parseMoney(form.elements[name].value);if(value===null){form.elements[name].setCustomValidity("Informe um valor válido, como 1.250,50.");form.elements[name].reportValidity();form.elements[name].focus();return null}return value}
document.addEventListener("submit",e=>{e.preventDefault();let f=e.target,d=formData(f);
if(f.id==="salary-form"){let v=submitMoney(f,"salary");if(v===null)return;state.salaryCents=v}
if(f.id==="extra-form"){let v=submitMoney(f,"amount");if(v===null)return;state.extras.push({id:id(),name:d.name.trim(),amount:v,recurring:d.recurring==="true",date:d.date||monthNow()+"-01"})}
if(f.id==="fixed-form"){let v=submitMoney(f,"amount");if(v===null)return;state.fixed.push({id:id(),name:d.name.trim(),amount:v,category:d.category,due:Number(d.due),status:d.status,month:currentMonth})}
if(f.id==="var-form"){let v=submitMoney(f,"amount");if(v===null)return;state.variable.push({id:id(),description:d.description.trim(),amount:v,category:d.category,date:d.date,payment:d.payment})}
if(f.id==="goal-form"){let target=parseMoney(d.target),current=parseMoney(d.current||"0");if(target===null||target===0||current===null){toast("Informe valores válidos para a meta.");return}state.goals.push({id:id(),name:d.name.trim(),type:d.type,target,current,deadline:d.deadline,color:d.color,history:[]})}
if(f.id==="category-form"){if(!d.name.trim()||state.categories.some(x=>x.name.toLowerCase()===d.name.trim().toLowerCase())){toast("Informe um nome novo para a categoria.");return}state.categories.push({name:d.name.trim(),color:"#89908a",kind:d.kind})}
save();render();toast("Alterações salvas.")});
document.addEventListener("input",e=>{if(e.target.matches('[inputmode="decimal"]'))e.target.setCustomValidity("");if(e.target.id==="search"){let q=e.target.value.toLowerCase();$("#vars-list").querySelectorAll(".row").forEach(r=>r.classList.toggle("hidden",!r.textContent.toLowerCase().includes(q))) }});
document.addEventListener("change",e=>{if(e.target.dataset.budget){let n=Number(e.target.value);if(n>=0&&n<=100){state.budgets[e.target.dataset.budget]=n;save();render()}}if(e.target.id==="import-file"&&e.target.files[0]){let file=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!validateImport(x))throw Error();state={...empty(),...x};save();render();toast("Backup importado.")}catch(_){toast("Arquivo inválido. Seus dados atuais foram mantidos.")}};r.readAsText(file)}});
function editItem(type,idv){let collection=type==="fixed"?"fixed":type==="variable"?"variable":type==="extra"?"extras":"goals";let x=state[collection].find(y=>y.id===idv);if(!x)return;
if(type==="extra"){let name=prompt("Nome da renda",x.name);if(name===null)return;let v=parseMoney(prompt("Valor",String(x.amount/100).replace(".",",")));if(v===null)return;x.name=name;x.amount=v}
else if(type==="fixed"||type==="variable"){let name=prompt(type==="fixed"?"Nome da conta":"Descrição",type==="fixed"?x.name:x.description);if(name===null)return;let v=parseMoney(prompt("Valor",String(x.amount/100).replace(".",",")));if(v===null)return;if(type==="fixed")x.name=name;else x.description=name;x.amount=v;let cat=prompt("Categoria",x.category);if(cat)x.category=cat}
else if(type==="goal"){let name=prompt("Nome da meta",x.name);if(name===null)return;let v=parseMoney(prompt("Valor-alvo",String(x.target/100).replace(".",",")));if(v===null||v===0)return;x.name=name;x.target=v}
save();render();toast("Item atualizado.")}
read();render();
</script>
</body></html>
